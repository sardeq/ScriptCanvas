<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Script Canvas</title>
    
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
</head>
<body>
    <header class="app-header">
        <h1>Script Canvas</h1>
        <button class="btn-play">Run</button>
    </header>

    <aside class="sidebar block-palette">
        <h2>Blocks</h2>
        <div class="block-dummy" draggable="true">Open URL</div>
        <div class="block-dummy" draggable="true">Click Element</div>
        <div class="block-dummy" draggable="true">Wait</div>
    </aside>

    <main class="canvas">
        <p class="canvas-placeholder">Drop blocks here to build your workflow</p>
    </main>

    <aside class="sidebar property-panel">
        <h2>Properties</h2>
        <p class="panel-placeholder">Select a block on the canvas to edit its settings.</p>
    </aside>

    <footer class="console">
        <div class="console-header">Console Output</div>
        <div class="console-logs">
            <p><span>System:</span> Ready to execute...</p>
        </div>
    </footer>

    <script type="module" src="js/app.js"></script>
</body>
</html>
